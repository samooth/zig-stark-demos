<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binius STARK: AES S-box Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Binius STARK: AES S-box Layer</h1>
      <p>Prove correct evaluation of 4 parallel AES S-boxes (inversion + affine layer) over GF(256).</p>
    </header>

    <section class="controls">
      <h2>Input (4 bytes, 0-255 each)</h2>
      <label>
        S-box inputs (comma-separated, 4 values per S-box):
        <input type="text" id="inputSbox" placeholder="0,1,99,255, 0,2,100,200, 0,4,150,180, 0,8,200,100" />
      </label>
      <button id="proveBtn">Prove</button>
      <button id="verifyBtn">Verify</button>
      <button id="clearBtn">Clear</button>
    </section>

    <section class="results">
      <h2>Results</h2>
      <pre id="output">Enter 16 input bytes (4 per S-box) and click "Prove".</pre>
    </section>

    <section class="info">
      <h2>S-box Outputs</h2>
      <table id="sboxTable">
        <thead><tr><th>S-box</th><th>Input</th><th>Inverse</th><th>Output</th></tr></thead>
        <tbody id="sboxBody"></tbody>
      </table>
    </section>

    <footer>
      <p>Zig Binius STARK demos. See <a href="https://github.com/samooth/zig-stark">zig-stark</a>.</p>
    </footer>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
